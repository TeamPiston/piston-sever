name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: piston
          POSTGRES_PASSWORD: piston
          POSTGRES_DB: piston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piston"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # e2e에서 보낸 메일을 외부로 내보내지 않고 받아 API로 조회하기 위한 SMTP 캡처 서버
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: piston
      DB_PASSWORD: piston
      DB_NAME: piston
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_USER: ci-minio
      MINIO_PASSWORD: ci-minio-password
      MINIO_BUCKET: piston-files
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: noreply@piston.test
      SMTP_PASS: ci-smtp
      MAILPIT_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4

      # pnpm 11.x는 Node 22.13+가 필요해서, 운영 이미지(Node 20)와 같은 조합인 pnpm 12로 고정
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # GitHub Actions 서비스 컨테이너는 실행 인자(server /data)를 줄 수 없어 직접 띄운다.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" \
            cgr.dev/chainguard/minio:latest server /data
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: E2E tests
        run: pnpm test:e2e --forceExit
